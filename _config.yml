# Ashish Chandra academic website
# Uses the Academic Pages repository as a remote Jekyll theme so the site follows
# the Academic Pages visual/sidebar format while keeping this repository compact.

locale                   : "en-US"
site_theme               : "default"
title                    : "Ashish Chandra"
title_separator          : "-"
name                     : &name "Ashish Chandra"
description              : &description "Academic website of Ashish Chandra, Illinois State University"
url                      : "https://ProfAshishChandra.github.io"
baseurl                  : ""
repository               : "ProfAshishChandra/ProfAshishChandra.github.io"

remote_theme             : "academicpages/academicpages.github.io"

author:
  avatar           : "profile.PNG"
  name             : "Ashish Chandra, Ph.D."
  bio              : "Assistant Professor, Management & Quantitative Methods. Research in optimization under uncertainty, network reliability and resilience, and supply chain systems."
  location         : "Normal, Illinois, USA"
  employer         : "Illinois State University"
  email            : "achand6@ilstu.edu"
  googlescholar    : "https://scholar.google.com/citations?user=W9TQPyIAAAAJ&hl=en&oi=ao"
  cv               : "/files/Ashish_Chandra_CV.pdf"
  # Deliberately omitted at the user's request:
  github           :
  orcid            :

publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"

breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

include:
  - _pages
  - files

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true

sass:
  style: compressed

permalink: /:categories/:title/
timezone: America/Chicago

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
